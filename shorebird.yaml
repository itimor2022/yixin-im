# Shorebird 配置占位文件。
# 正式接入 Shorebird 热更新时，请运行 `shorebird init` 覆盖本文件，
# 或将 app_id 替换为 Shorebird 控制台创建应用后返回的真实 id。
# 只要文件存在，Flutter 就不会因为 pubspec.yaml 中 `- shorebird.yaml`
# 资源引用缺失而在 `flutter pub get` / `flutter run` / `flutter build` 时报错。
app_id: 00000000-0000-0000-0000-000000000000
auto_update: false

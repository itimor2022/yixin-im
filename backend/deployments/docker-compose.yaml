# 文件用途：deployments\docker-compose.yaml 是一个运行时配置或容器编排文件。
# 核心逻辑：按文件中的顺序执行配置加载、数据库变更、构建部署或维护操作，并保持可重复执行。
#
# 注意：本 compose 文件是开发/单机部署用，**不包含** Redis Cluster 编排。
# 三机集群部署请参考 docs/plans/IM三机集群部署方案_20260728.md §9.2，
# 并使用 scripts/init-redis-cluster.sh 在物理机上构建 3 主 3 从集群。

version: '3.8'

services:
  # Go后端服务
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      # Redis 连接：单机部署下用 addrs；集群部署在物理机跑，容器里只填内网地址。
      - GENERIC_IM_REDIS_CLUSTER_NODES=redis:6379
      # 集群功能开关（开发/单机部署保持 false）
      - GENERIC_IM_CLUSTER_ENABLED=false
      - GENERIC_IM_CLUSTER_NODE_ID=node-local
    volumes:
      - ../uploads:/app/uploads
    depends_on:
      - mysql
      - mongodb
      - redis
    networks:
      - genericim
    restart: unless-stopped

  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: genericim-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: genericim
      MYSQL_DATABASE: genericim
      MYSQL_USER: genericim
      MYSQL_PASSWORD: genericim
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - genericim
    restart: unless-stopped

  # MongoDB数据库
  mongodb:
    image: mongo:7.0
    container_name: genericim-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: genericim
      MONGO_INITDB_ROOT_PASSWORD: genericim
      MONGO_INITDB_DATABASE: genericim_messages
    volumes:
      - mongodb_data:/data/db
    networks:
      - genericim
    restart: unless-stopped

  # Redis（单机部署）。生产 3 机集群部署改用 scripts/init-redis-cluster.sh。
  redis:
    image: redis:7-alpine
    container_name: genericim-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - genericim
    restart: unless-stopped

  # Redis Commander (可视化管理)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: genericim-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - genericim
    restart: unless-stopped

networks:
  genericim:
    driver: bridge

volumes:
  mysql_data:
  mongodb_data:
  redis_data:

server:
  port: 8080
  mode: release  # 生产环境使用 release
  read_timeout: 10s
  write_timeout: 10s
  base_url: "https://im.yi-ruan.com"  # 线上后端域名，用于上传等完整 URL
  register_base_url: "https://im.yi-ruan.com"  # 线上注册页域名，邀请码链接优先使用它
  upload_dir: "./uploads"  # 上传文件存储目录

mysql:
  host: localhost
  port: 3306
  user: yiryanran
  password: yiryanran
  database: yiryanran
  max_idle_conns: 100
  max_open_conns: 1000
  conn_max_lifetime: 3600s

mongodb:
  # 宝塔创建的用户在「数据库名」库下，必须加 authSource=数据库名，否则认证失败
  uri: mongodb://grimimim:grimimim@localhost:27017/?authSource=grimimim
  database: grimimim_messages
  max_pool_size: 500
  min_pool_size: 50

redis:
  addr: localhost:6379
  password: ""  # 如有密码请填写
  db: 0
  pool_size: 1000
  min_idle_conns: 100

jwt:
  secret: 9b44e3e0d4d64246aaf53c7f1d92e6f0b78ab54c8f2c4a5e91d0f6c3b7a82d19  # 生产环境请独立保管，泄露后必须重新生成并强制用户重新登录
  expire: 720h  # 30 days
  refresh_expire: 2160h  # 90 days, allows long-idle clients to refresh without re-login

websocket:
  read_buffer_size: 4096
  write_buffer_size: 4096
  max_message_size: 65536
  pong_wait: 60s
  ping_period: 54s
  write_wait: 10s

message_queue:
  channel_buffer: 10000
  workers: 100
  batch_size: 100
  flush_interval: 100ms

shard:
  count: 64

# 声网 Agora 音视频通话配置
agora:
  enabled: false       # 是否启用音视频服务
  app_id: ""           # 声网 App ID
  app_certificate: ""  # 声网 App Certificate
  token_expire: 3600   # Token 有效期（秒）

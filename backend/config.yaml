server:
  port: 8080
  mode: debug  # debug/release
  read_timeout: 10s
  write_timeout: 10s
  base_url: ""  # API/媒体服务器外部访问地址，如 https://api.example.com
  register_base_url: ""  # 注册页外部访问地址，如 https://app.example.com，留空则回退到 base_url

mysql:
  host: localhost
  port: 3306
  user: yiryanran
  password: yiryanran
  database: yiryanran
  max_idle_conns: 100
  max_open_conns: 1000
  conn_max_lifetime: 3600s

mongodb:
  uri: mongodb://localhost:27017
  database: yiryanran_messages
  max_pool_size: 2000
  min_pool_size: 200

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 1000
  min_idle_conns: 100

jwt:
  secret: your-super-secret-jwt-key-change-in-production
  expire: 720h  # 30 days
  refresh_expire: 2160h  # 90 days, allows long-idle clients to refresh without re-login

websocket:
  read_buffer_size: 4096
  write_buffer_size: 4096
  max_message_size: 65536
  pong_wait: 60s
  ping_period: 54s
  write_wait: 10s

message_queue:
  channel_buffer: 10000
  workers: 100
  batch_size: 100
  flush_interval: 100ms

shard:
  count: 64  # 分片数量，建议为2的幂次方

# 声网 Agora 音视频通话配置
agora:
  enabled: false       # 是否启用音视频服务
  app_id: ""           # 声网 App ID（从声网控制台获取）
  app_certificate: ""  # 声网 App Certificate（从声网控制台获取）
  token_expire: 3600   # Token 有效期（秒），默认1小时

# 微信 / 支付宝在线充值（默认关闭；notify 地址 = notify_base_url + /api/v1/payment/notify/{wechat|alipay}）
payment:
  enabled: false
  notify_base_url: ""   # 留空则使用 server.base_url
  min_amount: 0.01
  max_amount: 50000
  wechat:
    enabled: false
    mch_id: ""
    mch_api_v3_key: ""
    mch_certificate_serial: ""
    app_id: ""                    # 微信开放平台「移动应用」AppID
    private_key_path: ""          # apiclient_key.pem
    h5_app_name: "壹信"
    h5_app_url: "https://example.com"
    h5_bundle_id: ""              # iOS Bundle ID（H5 场景建议填写）
    h5_package_name: ""           # Android 包名（H5 场景建议填写）
  alipay:
    enabled: false
    app_id: ""
    private_key_path: ""          # 应用私钥 PEM 文本文件
    alipay_public_key_path: ""    # 支付宝公钥（非应用公钥）
    is_production: true
    return_url: ""                # 电脑网站支付同步跳转，可选

# 短信（绑定手机号验证码）；provider: smsbao | aliyun | tencent；可与管理后台「短信网关」合并
sms:
  enabled: false
  provider: smsbao               # smsbao | aliyun | tencent
  message_template: "【壹信】您的验证码是{code}，5分钟内有效。"
  smsbao:
    user: ""
    password: ""                 # 短信宝登录密码，接口传 MD5
  aliyun:
    access_key_id: ""
    access_key_secret: ""
    region: cn-hangzhou
    sign_name: ""
    template_code: ""             # 模板变量名 code
  tencent:
    secret_id: ""
    secret_key: ""
    region: ap-guangzhou
    sdk_app_id: ""
    sign_name: ""
    template_id: ""               # 模板仅一个变量时为验证码内容

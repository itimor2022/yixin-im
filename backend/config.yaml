# 文件用途：config.yaml 是一个运行时配置或容器编排文件。
# 核心逻辑：按文件中的顺序执行配置加载、数据库变更、构建部署或维护操作，并保持可重复执行。

server:
  port: 8080
  mode: debug  # debug/release
  read_timeout: 10s
  write_timeout: 35m
  base_url: ""  # API/媒体服务器外部访问地址，如 https://api.example.com
  register_base_url: ""  # 注册页外部访问地址，如 https://app.example.com，留空则回退到 base_url
  allowed_origins: []  # API CORS Origin 白名单；留空兼容所有来源，生产建议填写前端域名

storage:
  provider: local  # local | aliyun | qiniu；后台「系统设置」里的云存储配置优先
  local:
    base_url: ""  # 留空使用 server.base_url
  aliyun:
    endpoint: ""  # 如 oss-cn-hangzhou.aliyuncs.com
    bucket: ""
    access_key_id: ""
    access_key_secret: ""
    public_base_url: ""  # 如 https://cdn.example.com，留空使用 https://{bucket}.{endpoint}
    use_https: true
  qiniu:
    upload_url: "https://upload.qiniup.com"
    bucket: ""
    access_key: ""
    secret_key: ""
    public_base_url: ""  # 如 https://cdn.example.com
    use_https: true

mysql:
  host: localhost
  port: 3306
  user: genericim_dev
  password: ""
  database: genericim_dev
  max_idle_conns: 100
  max_open_conns: 1000
  conn_max_lifetime: 3600s

mongodb:
  uri: mongodb://localhost:27017
  database: genericim_dev_messages
  max_pool_size: 2000
  min_pool_size: 200

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 1000
  min_idle_conns: 100

jwt:
  secret: dev-only-change-me
  expire: 720h  # 30 days
  refresh_expire: 2160h  # 90 days, allows long-idle clients to refresh without re-login

websocket:
  read_buffer_size: 4096
  write_buffer_size: 4096
  max_message_size: 65536
  pong_wait: 60s
  ping_period: 54s
  write_wait: 10s
  allowed_origins: []  # WebSocket Origin 白名单；留空兼容所有来源，生产建议填写前端域名

client_bootstrap:
  enabled: true
  version: 1
  ttl_seconds: 300
  api_endpoints: []
  ws_endpoints: []
  media_base_urls: []
  strategy:
    connect_timeout_ms: 5000
    health_timeout_ms: 3000
    fail_threshold: 1
    cooldown_seconds: 60
    prefer_last_success: true

message_queue:
  channel_buffer: 10000
  workers: 100
  batch_size: 100
  flush_interval: 100ms

# 消息恢复边界：默认保留 120 个月，客户端消息 ID 幂等记录不得更短。
message_storage:
  retention_months: 120
  idempotency_months: 120

shard:
  count: 64  # 分片数量，建议为2的幂次方

# 声网 Agora 音视频通话配置
agora:
  enabled: false       # 是否启用音视频服务
  app_id: ""           # 声网 App ID（从声网控制台获取）
  app_certificate: ""  # 声网 App Certificate（从声网控制台获取）
  token_expire: 3600   # Token 有效期（秒），默认1小时

# LiveKit 音视频通话/会议配置（后台设置可覆盖）
livekit:
  enabled: false
  server_url: ""       # 例如 wss://livekit.example.com
  api_key: ""
  api_secret: ""
  token_expire: 3600

# 微信 / 支付宝在线充值（默认关闭；notify 地址 = notify_base_url + /api/v1/payment/notify/{wechat|alipay}）
payment:
  enabled: false
  notify_base_url: ""   # 留空则使用 server.base_url
  min_amount: 0.01
  max_amount: 50000
  wechat:
    enabled: false
    mch_id: ""
    mch_api_v3_key: ""
    mch_certificate_serial: ""
    app_id: ""                    # 微信开放平台「移动应用」AppID
    private_key_path: ""          # apiclient_key.pem
    h5_app_name: "通用IM"
    h5_app_url: "https://example.com"
    h5_bundle_id: ""              # iOS Bundle ID（H5 场景建议填写）
    h5_package_name: ""           # Android 包名（H5 场景建议填写）
  alipay:
    enabled: false
    app_id: ""
    private_key_path: ""          # 应用私钥 PEM 文本文件
    alipay_public_key_path: ""    # 支付宝公钥（非应用公钥）
    is_production: true
    return_url: ""                # 电脑网站支付同步跳转，可选

# 短信（绑定手机号验证码）；provider: smsbao | aliyun | tencent；可与管理后台「短信网关」合并
sms:
  enabled: false
  provider: smsbao               # smsbao | aliyun | tencent
  message_template: "【通用IM】您的验证码是{code}，5分钟内有效。"
  smsbao:
    user: ""
    password: ""                 # 短信宝登录密码，接口传 MD5
  aliyun:
    access_key_id: ""
    access_key_secret: ""
    region: cn-hangzhou
    sign_name: ""
    template_code: ""             # 模板变量名 code
  tencent:
    secret_id: ""
    secret_key: ""
    region: ap-guangzhou
    sdk_app_id: ""
    sign_name: ""
    template_id: ""               # 模板仅一个变量时为验证码内容

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# Keep Kotlin incremental disabled on Windows to avoid occasional cache corruption.
kotlin.incremental=false
org.gradle.parallel=false

android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
kotlin.jvm.target.validation.mode=warning

# -----------------------------------------------------------------------------
# 老设备兼容开关（详见 android/app/build.gradle.kts 顶部注释）
# -----------------------------------------------------------------------------
#   true  → 兼容包：minSdk=26 + arm64-v8a + armeabi-v7a（默认）
#   false → 精简包：minSdk=30 + arm64-v8a only（APK 更小）
# 不写此项时代码里默认按 true 处理（兼容包）。
# 环境变量 LEGACY_COMPAT / 命令行 -PLEGACY_COMPAT 优先级都高于此文件。
# LEGACY_COMPAT=true

# -----------------------------------------------------------------------------
# Vendor push settings (Huawei / Xiaomi / OPPO)
# -----------------------------------------------------------------------------
# Master switch: when false, vendor SDK dependencies are not added.
# When set to true, missing SDK coordinates / vendor credentials will fail build (fail-fast).
# ENABLE_VENDOR_PUSH_SDK=false

# Push credentials placeholders (read by AndroidManifest placeholders).
# PUSH_HMS_APP_ID=123456789
# PUSH_XIAOMI_APP_ID=2882303761xxxxxxx
# PUSH_XIAOMI_APP_KEY=5xxxxxxxxxxxxxxx
# PUSH_OPPO_APP_KEY=xxxxxxxxxxxxxxxx
# PUSH_OPPO_APP_SECRET=xxxxxxxxxxxxxxxx

# SDK coordinates (required only when ENABLE_VENDOR_PUSH_SDK=true).
# Use official coordinates from each vendor console/documentation.
# HMS_PUSH_SDK=com.huawei.hms:push:6.12.0.300
# XIAOMI_PUSH_SDK=com.xiaomi.mipush:mipush-sdk:5.0.8
# OPPO_PUSH_SDK=com.heytap.msp:push:3.4.0

# Optional: when Xiaomi artifact is hosted in a custom/private maven.
# XIAOMI_PUSH_MAVEN_REPO=https://your-maven-host/repository/maven-public/

# Optional: when OPPO artifact is hosted in a custom/private maven.
# OPPO_PUSH_MAVEN_REPO=https://your-maven-host/repository/maven-public/

# Vendor push production template (copy entries into android/gradle.properties)
# Do not commit real secrets.

# Enable official vendor SDK dependencies and strict config checks.
ENABLE_VENDOR_PUSH_SDK=true

# Manifest placeholders
PUSH_HMS_APP_ID=
PUSH_JPUSH_APP_KEY=
PUSH_JPUSH_CHANNEL=default
PUSH_XIAOMI_APP_ID=
PUSH_XIAOMI_APP_KEY=
PUSH_OPPO_APP_KEY=
PUSH_OPPO_APP_SECRET=

# SDK coordinates (use official versions from vendor docs/console)
HMS_PUSH_SDK=com.huawei.hms:push:6.12.0.300
JPUSH_SDK=cn.jiguang.sdk:jpush:5.5.0
JCORE_SDK=cn.jiguang.sdk:jcore:5.2.0
XIAOMI_PUSH_SDK=com.xiaomi.mipush:mipush-sdk:5.0.8
OPPO_PUSH_SDK=com.heytap.msp:push:3.4.0

# Optional: custom Xiaomi maven repo (if required in your environment)
# XIAOMI_PUSH_MAVEN_REPO=https://your-maven-host/repository/maven-public/

# Optional: custom OPPO maven repo (if default heytap repo is unreachable in your environment)
# OPPO_PUSH_MAVEN_REPO=https://your-maven-host/repository/maven-public/

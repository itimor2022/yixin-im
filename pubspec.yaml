name: gao_ran_im
description: A Telegram-style instant messaging app built with Flutter.
publish_to: 'none'
version: 1.0.5+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # 路由
  go_router: ^13.0.1
  
  # 本地存储
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  universal_io: ^2.2.2
  
  # 网络
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  
  # UI 组件
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_markdown: ^0.6.18
  
  # 动画
  flutter_animate: ^4.3.0
  animations: ^2.0.11
  
  # 图片/媒体
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  crop_your_image: ^1.1.0
  photo_view: ^0.14.0
  video_player: ^2.8.2
  audioplayers: ^5.2.1
  flutter_image_compress: ^2.1.0  # 图片压缩
  
  # 网络状态监听
  connectivity_plus: ^6.0.3
  
  # 录音
  record: ^5.1.0
  
  # 保存到相册
  gal: ^2.3.0
  
  # 工具
  intl: ^0.20.2
  uuid: ^4.3.3
  equatable: ^2.0.5
  device_info_plus: ^10.1.0
  collection: ^1.18.0
  lpinyin: ^2.0.3
  
  # 内置浏览器
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.16.0
  share_plus: ^7.2.2
  
  # 表情/贴纸
  emoji_picker_flutter: ^1.6.4
  
  # 权限
  permission_handler: ^11.2.0
  
  # 生物识别认证
  local_auth: ^2.1.8
  
  # 二维码
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  
  # 通知
  flutter_local_notifications: ^19.0.0
  flutter_app_badger: ^1.5.0

  # Firebase 推送（Android FCM）
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  
  # 加密
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  
  # 音视频通话（声网）
  agora_rtc_engine: ^6.3.2
  
  # iOS CallKit 来电显示
  flutter_callkit_incoming: ^2.0.4+1
  
  # 悬浮窗/画中画
  pip_view: ^0.9.7
  
  # 保持屏幕常亮
  wakelock_plus: ^1.2.8
  
  # 后台服务保活
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.7
  
  cupertino_icons: ^1.0.6
  flutter_staggered_grid_view: ^0.7.0
  photo_manager: ^3.8.3
  video_thumbnail: ^0.5.6
  package_info_plus: ^9.0.0
  flutter_secure_storage: ^10.0.0
  
  # 桌面端支持 (macOS/Windows)
  window_manager: ^0.3.8        # 窗口管理
  tray_manager: ^0.2.2          # 系统托盘（兼容 uuid 4.x）
  hotkey_manager: ^0.2.3        # 全局快捷键
  screen_retriever: ^0.1.9      # 屏幕信息
  desktop_drop: ^0.4.4
  webview_windows: ^0.4.0
  
  # 可见性检测（优化 Lottie 动画性能）
  visibility_detector: ^0.4.0+2
  shorebird_code_push: ^2.0.6
  geolocator: ^13.0.2
  speech_to_text: ^7.3.0
  file_saver: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  isar_generator: ^3.1.0+1
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  record_web: ^1.3.0
  record_linux: ^1.2.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
    - assets/icon_foreground.png
    - assets/images/
    - assets/images/backgrounds/
    - assets/icons/
    - assets/animations/
    - assets/stickers/
    - assets/sounds/
    - assets/emoji/lottie/
    - shorebird.yaml


flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#1a1a1a"
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true

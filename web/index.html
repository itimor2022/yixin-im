<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YiXin IM web client">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">

  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA 支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="壹信IM">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Windows 磁贴 -->
  <meta name="msapplication-TileColor" content="#1a1a1a">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="壹信IM">
  <meta property="og:description" content="安全、快速、稳定的即时通讯应用">
  <meta property="og:image" content="icons/Icon-512.png">

  <title>壹信IM</title>
</head>
<body>
  <script>
    (function () {
      try {
        const cachedTitle = window.localStorage.getItem('app_browser_title');
        if (cachedTitle && cachedTitle.trim()) {
          document.title = cachedTitle.trim();
        }
      } catch (_) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
